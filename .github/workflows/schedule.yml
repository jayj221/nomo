# Scheduled jobs — replaces Vercel crons (Hobby plan only allows daily).
# Times are UTC. Requires:
#   secret  CRON_SECRET — must match the Vercel env var of the same name
#   variable APP_URL    — the production URL
name: schedule

on:
  schedule:
    - cron: "50 7 * * *" # build everyone's daily lineup of ten
    - cron: "0 10-20 * * *" # random-window tick (fires exactly once/day)
  workflow_dispatch:
    inputs:
      path:
        description: "API path to hit (for manual testing)"
        required: false
        default: "/api/cron/fire-window?slot=manual"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          case "${{ github.event.schedule }}" in
            "50 7 * * *")   path="/api/cron/daily-match" ;;
            "0 10-20 * * *") path="/api/cron/fire-window?slot=random" ;;
            *) path="${{ inputs.path }}" ;;
          esac
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL$path"
